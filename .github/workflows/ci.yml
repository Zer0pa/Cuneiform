name: ci

# Minimal private-repo verification per Gnosis_Repo_Front_Door_Agent_Brief.md §3.
# Boring by design:
#   * checkout
#   * set up Python
#   * install package (no extras; smoke runner is stdlib-only)
#   * pytest -q (3 hermetic self-tests)
#   * cuneiform-smoke --help (entry-point sanity)
#   * leak-pattern scan over tracked files
# It does NOT fetch private HF artefacts, hit external APIs, or run the
# real-manifest smoke (that requires a locally-held pinned manifest copy).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install + pytest + smoke help + leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Pytest (hermetic self-test)
        run: pytest -q

      - name: cuneiform-smoke --help
        run: cuneiform-smoke --help

      - name: Operational-leak scan
        # Forbidden patterns: concrete RunPod IPs, raw SSH endpoints, local
        # home paths, retired monorepo workspace paths, known pod IDs.
        # Symbolic placeholders such as <RUNPOD_HOST> are allowed.
        # The scan ignores the workflow file itself (this comment block
        # legitimately mentions the patterns) and the git/venv directories.
        run: |
          set -e
          if grep -RInE \
            -e '38\.80\.[0-9]+\.[0-9]+' \
            -e 'ssh -p [0-9]+ root@' \
            -e '/Users/Zer0pa' \
            -e '/workspace/ZPE-Cipher' \
            -e '7k3riasglemecu' \
            --exclude-dir=.git \
            --exclude=ci.yml \
            . ; then
            echo "::error::Operational-leak scan found forbidden patterns above."
            exit 1
          fi
          echo "Leak scan: OK (no concrete IPs/SSH endpoints/local paths/pod IDs)."

      - name: Final git status (must be clean)
        run: |
          set -e
          dirty="$(git status --short)"
          if [ -n "$dirty" ]; then
            echo "::error::Working tree dirty after install + tests:"
            echo "$dirty"
            exit 1
          fi
          echo "Working tree clean."
